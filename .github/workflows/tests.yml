name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell, so the micromamba environment is active in every step.
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Create the conda environment from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # The cached environment is keyed on environment.yml only, so refresh
      # the editable installs in case a pyproject.toml changed.
      - name: Refresh the editable installs
        run: python -m pip install --no-deps -e packages/libwise -e packages/wise

      - name: Run the test suite
        run: python -m pytest packages/ -q
