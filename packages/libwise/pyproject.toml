[project]
name = "libwise"
version = "0.5.0.dev0"
description = "Utilities for plotting, wavelet transforms, image processing, and Qt UI (modernization fork)"
authors = [{ name = "Florent Mertens", email = "flomertens@gmail.com" }]
maintainers = [{ name = "Eileen Meyer", email = "eileen.meyer@gmail.com" }]
license = { text = "GPL-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "astropy>=6.0",
    "matplotlib>=3.7",
    "pyregion>=2.2",
    "uncertainties>=3.2",
    "pandas>=2.0",
    "Pillow>=10.0",
    "appdirs>=1.4",
    "imageio>=2.31",
]

[project.optional-dependencies]
ui = ["PyQt5>=5.15"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libwise"]
