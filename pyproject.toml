# This file holds shared tool config only. There is no [project] table at the
# root — the two installable packages live under packages/libwise and
# packages/wise, each with its own pyproject.toml.

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "E741",  # legacy ambiguous names (l, I) used widely in the science code
    "F401",  # re-exports via `from .x import *` are intentional in __init__
    "F403",
    "F405",
    # The rules below produce many findings against upstream-inherited code
    # that is out of scope for the Py2 → Py3 port. Triage rather than
    # silence individually:
    "UP031",  # printf-style %-formatting; pervasive in scientific code
    "E731",   # lambda assignments; idiomatic in upstream
    "E712",   # `== True/False`; common in pandas/numpy boolean masks
    "E722",   # bare `except:` — upstream uses these defensively
    "E402",   # module-level imports not at top — used after sys.path tweaks
    "F841",   # unused locals — mostly upstream dead assignments / debug stubs
    "F821",   # undefined names in upstream-inherited dead code paths
              # (Py2 `cmp`, debug-only call sites, `__main__` smoke blocks)
]

[tool.pytest.ini_options]
testpaths = ["packages/libwise/tests", "packages/wise/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
